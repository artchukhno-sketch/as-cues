<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диагностика языка</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #111; background: #fff; }
  h1 { font-size: 22px; }
  .box { background: #f4f4f4; border-radius: 10px; padding: 16px 20px; margin: 14px 0; }
  .k { color: #888; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
  .v { font-size: 18px; font-weight: 600; margin-top: 4px; word-break: break-all; }
  .big { font-size: 28px; }
  .ru { color: #b00; } .uk { color: #0a7; } .en { color: #06c; }
</style>
</head>
<body>
<h1>Диагностика автовыбора языка</h1>
<div class="box">
  <div class="k">navigator.languages (что отдаёт браузер)</div>
  <div class="v" id="langs">—</div>
</div>
<div class="box">
  <div class="k">navigator.language (главный язык)</div>
  <div class="v" id="lang">—</div>
</div>
<div class="box">
  <div class="k">Скрипт открыл бы версию</div>
  <div class="v big" id="pick">—</div>
</div>
<div class="box">
  <div class="k">Сохранённый выбор (lang-choice)</div>
  <div class="v" id="saved">—</div>
</div>
<script>
(function () {
  var langsEl = document.getElementById('langs');
  var langs = navigator.languages || [navigator.language || ''];
  langsEl.textContent = JSON.stringify(langs);
  document.getElementById('lang').textContent = navigator.language || '(пусто)';

  var ruCis = ['ru', 'be', 'kk', 'ky', 'uz', 'tg', 'tk', 'az', 'hy', 'mo'];
  var pick = '';
  for (var i = 0; i < langs.length; i++) {
    var l = String(langs[i]).toLowerCase().slice(0, 2);
    if (l === 'uk') { pick = 'uk'; break; }
    if (ruCis.indexOf(l) >= 0) { pick = 'ru'; break; }
    pick = 'en'; break;
  }
  if (!pick) pick = 'en';

  var names = { ru: 'РУССКУЮ (остаётся на главной)', uk: 'УКРАИНСКУЮ /uk/', en: 'АНГЛИЙСКУЮ /en/' };
  var el = document.getElementById('pick');
  el.textContent = names[pick];
  el.className = 'v big ' + pick;

  try {
    document.getElementById('saved').textContent = localStorage.getItem('lang-choice') || '(ничего не выбрано)';
  } catch (e) {
    document.getElementById('saved').textContent = '(localStorage недоступен)';
  }
})();
</script>
</body>
</html>
